# Uzbek messages (Latin script, matching the workbook's own Uzbek text).
# Selected when the request carries Accept-Language: uz.
#
# Every key in messages.properties must exist here too — a missing key falls
# back to the Russian default, which is exactly the mixed-language problem this
# file exists to remove.
#
# APOSTROPHES — Uzbek is full of them (bog'langan, ma'lumot, ro'yxat) and
# MessageFormat treats ' as its escape character, so a lone apostrophe is
# silently swallowed: "bog'langan" comes out as "boglangan". In any message
# containing a POSITIONAL placeholder ({0}, {1}) the apostrophe must therefore
# be DOUBLED ('') — MessageFormat unescapes it back to one on render.
#
# Only those messages. Bean Validation messages below use NAMED placeholders
# ({min}, {max}, {value}) and are interpolated by Hibernate Validator, not
# MessageFormat; doubling there would print the apostrophe twice. Messages with
# no placeholder at all skip MessageFormat too, so they keep a single quote.
# MessagesLocalizationTest guards both halves of this rule.

# ---- Bean Validation ------------------------------------------------------
