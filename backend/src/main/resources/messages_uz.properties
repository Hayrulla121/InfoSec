jakarta.validation.constraints.NotNull.message=Maydonni to'ldirish shart
jakarta.validation.constraints.NotEmpty.message=Maydonni to'ldirish shart
jakarta.validation.constraints.Email.message=Elektron pochta manzili noto'g'ri
jakarta.validation.constraints.Size.message=Uzunligi {min} dan {max} belgigacha bo'lishi kerak
