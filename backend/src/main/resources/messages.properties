# Russian messages. This is the DEFAULT bundle: any locale without its own
# file falls back here, which is why it carries Russian rather than English.
#
# Two different placeholder styles live in this file and they are not
# interchangeable:
#   {min} {max} {value}  - Bean Validation. Hibernate Validator substitutes
#                          them by reading the annotation's attributes.
#   {0} {1}              - MessageFormat. Spring substitutes positional args
#                          passed from GlobalExceptionHandler.

#
# APOSTROPHES: MessageFormat treats ' as an escape character, so a lone
# apostrophe is silently swallowed and "bog'langan" renders as "boglangan".
# In any message containing a POSITIONAL placeholder ({0}, {1}) the apostrophe
# must therefore be DOUBLED ('').
#
# This applies only to those messages. Bean Validation messages use NAMED
# placeholders ({min}, {max}, {value}) and are interpolated by Hibernate
# Validator, not MessageFormat - doubling an apostrophe there would print it
# twice. Messages with no placeholders at all skip MessageFormat as well.
# ---- Bean Validation ------------------------------------------------------
jakarta.validation.constraints.NotBlank.message=Поле обязательно для заполнения
jakarta.validation.constraints.NotNull.message=Поле обязательно для заполнения
jakarta.validation.constraints.NotEmpty.message=Поле обязательно для заполнения
jakarta.validation.constraints.Email.message=Некорректный адрес электронной почты
jakarta.validation.constraints.Size.message=Длина должна быть от {min} до {max} символов
jakarta.validation.constraints.Min.message=Значение должно быть не меньше {value}
jakarta.validation.constraints.Max.message=Значение должно быть не больше {value}
jakarta.validation.constraints.DecimalMin.message=Значение должно быть не меньше {value}
jakarta.validation.constraints.DecimalMax.message=Значение должно быть не больше {value}
jakarta.validation.constraints.Digits.message=Не более {integer} цифр до запятой и {fraction} после
jakarta.validation.constraints.Positive.message=Значение должно быть положительным
jakarta.validation.constraints.PastOrPresent.message=Дата не может быть в будущем

